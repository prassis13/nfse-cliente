<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Solicitar nota fiscal</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e8eef5;font:16px system-ui,sans-serif}main{max-width:580px;margin:24px auto;padding:24px;background:#1b2938;border-radius:18px;box-shadow:0 5px 25px #17354a15}h1{font-size:25px;margin:0}p{color:#b9c8d8}label{display:block;font-weight:600;margin:16px 0 6px}input,select{width:100%;padding:13px;border:1px solid #9caebc;border-radius:8px;background:#25374a;color:#f0f5fa;font:inherit;min-width:0}option{background:#25374a;color:#f0f5fa}button{width:100%;margin-top:24px;padding:17px;background:#08783e;color:white;border:0;border-radius:10px;font:600 16px system-ui;cursor:pointer}#erro{color:#ffb4a9}@media(max-width:600px){main{margin:12px;padding:20px}}input[type=date]{color-scheme:dark;min-height:50px}input:focus,select:focus{outline:2px solid #6cb9ff}#erro{margin-top:12px}a{color:#a7e5bc} </style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#101923"><link rel="apple-touch-icon" href="icon-192.png"></head><body><main><h1>Solicitação de nota fiscal</h1><p>Thiago Reis de Assis</p><aside id="installBox" style="padding:14px;background:#142638;border-radius:10px;margin:16px 0"><strong>📲 Instale no seu celular</strong><p>Tenha o aplicativo sempre à mão.</p><button type="button" id="install" style="margin-top:0">Instalar aplicativo</button><p id="installHelp" hidden></p></aside><form id="f" novalidate><label for="cnpj">CNPJ do contratante</label><input id="cnpj" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00" required><label for="empresa">Empresa contratante</label><input id="empresa" required><label for="municipio">Município do evento</label><input id="municipio" required><label for="estado">Estado do evento</label><select id="estado" required><option value="">Selecione o estado</option></select><label for="nota">Data da nota fiscal</label><input type="date" id="nota" required><label for="evento">Data do evento</label><input type="date" id="evento" required><label for="venc">Data de vencimento</label><input type="date" id="venc" required><label for="valor">Valor do serviço</label><input id="valor" inputmode="numeric" placeholder="R$ 0,00" required><div id="erro" role="alert"></div><div id="alternativa" hidden><a id="linkZap" target="_self">Abrir WhatsApp novamente</a> <button type="button" id="copyMsg">Copiar mensagem</button></div><button type="submit">Enviar para Paulo pelo WhatsApp</button></form></main><script>
const el=id=>document.getElementById(id), digits=s=>s.replace(/\D/g,'');const estados='AC:Acre|AL:Alagoas|AP:Amapá|AM:Amazonas|BA:Bahia|CE:Ceará|DF:Distrito Federal|ES:Espírito Santo|GO:Goiás|MA:Maranhão|MT:Mato Grosso|MS:Mato Grosso do Sul|MG:Minas Gerais|PA:Pará|PB:Paraíba|PR:Paraná|PE:Pernambuco|PI:Piauí|RJ:Rio de Janeiro|RN:Rio Grande do Norte|RS:Rio Grande do Sul|RO:Rondônia|RR:Roraima|SC:Santa Catarina|SP:São Paulo|SE:Sergipe|TO:Tocantins';for(const item of estados.split('|')){const [uf,nome]=item.split(':');el('estado').add(new Option(nome+' ('+uf+')',uf))}const now=new Date();el('nota').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');el('cnpj').addEventListener('input',e=>{const d=digits(e.target.value).slice(0,14);e.target.value=d.slice(0,2)+(d.length>2?'.'+d.slice(2,5):'')+(d.length>5?'.'+d.slice(5,8):'')+(d.length>8?'/'+d.slice(8,12):'')+(d.length>12?'-'+d.slice(12):'')});el('valor').addEventListener('input',e=>{const n=Number(digits(e.target.value).slice(0,12));e.target.value=(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})});const fmt=s=>s.split('-').reverse().join('/');el('f').addEventListener('submit',e=>{e.preventDefault();el('erro').textContent='';el('alternativa').hidden=true;for(const id of ['cnpj','empresa','municipio','estado','nota','evento','venc','valor']){if(!el(id).value.trim()){el('erro').textContent='Preencha: '+el(id).previousElementSibling.textContent;el(id).focus();return}}if(digits(el('cnpj').value).length!==14){el('erro').textContent='Informe os 14 dígitos do CNPJ.';return}if(!el('empresa').value.trim()||!el('municipio').value.trim()||Number(digits(el('valor').value))<=0){el('erro').textContent='Informe empresa, município e valor maior que zero.';return}const msg=['SOLICITAÇÃO DE NOTA FISCAL — THIAGO REIS DE ASSIS','CNPJ: '+el('cnpj').value,'Empresa: '+el('empresa').value.trim(),'Município: '+el('municipio').value.trim(),'Estado: '+el('estado').value,'Data da nota: '+fmt(el('nota').value),'Data do evento: '+fmt(el('evento').value),'Vencimento: '+fmt(el('venc').value),'Valor: '+el('valor').value].join('\n');const url='https://wa.me/5521981641587?text='+encodeURIComponent(msg);el('copyMsg').onclick=async()=>{try{await navigator.clipboard.writeText(msg);el('erro').textContent='Mensagem copiada.'}catch{const t=document.createElement('textarea');t.value=msg;el('alternativa').append(t);t.select();el('erro').textContent='Copie o texto selecionado manualmente.'}};el('linkZap').href=url;el('alternativa').hidden=false;window.location.href=url});
</script><script>
let installPrompt;const box=document.getElementById('installBox'),help=document.getElementById('installHelp');if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)box.hidden=true;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});window.addEventListener('appinstalled',()=>box.hidden=true);document.getElementById('install').onclick=async()=>{if(installPrompt){await installPrompt.prompt();const choice=await installPrompt.userChoice;if(choice.outcome==='accepted')box.hidden=true;installPrompt=null;return}help.hidden=false;help.textContent=location.protocol!=='https:'?'Abra a versão hospedada em HTTPS para instalar.':/iPhone|iPad|iPod/i.test(navigator.userAgent)?'No Safari, toque em Compartilhar e Adicionar à Tela de Início.':'Abra no Chrome e use o menu ⋮ → Instalar aplicativo ou Adicionar à tela inicial.'};if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
